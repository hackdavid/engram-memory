[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engram"
dynamic = ["version"]
description = "A standalone, async-first graph memory SDK for AI applications. Neo4j-backed, LLM-driven dynamic schema."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Daud Dewan"},
]
keywords = [
    "graph-memory", "neo4j", "llm", "knowledge-graph",
    "ai-memory", "async", "pydantic", "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Typing :: Typed",
    "Framework :: Pydantic :: 2",
]
dependencies = [
    "neo4j>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.30",
    "sentence-transformers>=2.0",
    "torch",
]

[project.scripts]
engram-e2e = "engram.cli.e2e_validate:main"

[project.optional-dependencies]
openai-embed = ["openai>=1.0"]
# Backward compatible no-op: local embeddings ship with the core package.
local-embed = ["sentence-transformers>=2.0", "torch"]
observability = ["opentelemetry-api>=1.0"]
all = [
    "engram[openai-embed]",
    "engram[observability]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "python-dotenv>=1.0",
    "ruff>=0.4",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/hackdavid/Engram"
Documentation = "https://github.com/hackdavid/Engram/tree/main/docs"
Repository = "https://github.com/hackdavid/Engram"
Issues = "https://github.com/hackdavid/Engram/issues"

[tool.hatch.version]
path = "engram/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires real Neo4j + LLM (set ENGRAM_LIVE_TESTS=1)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
